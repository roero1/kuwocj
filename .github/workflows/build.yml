name: Build KuwoAutoPlay
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tweak using Theos
        uses: theos/theos-action@main
        with:
          target: iphone:clang:17.0:17.0
          package: true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
