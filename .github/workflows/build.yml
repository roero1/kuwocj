name: Theos Tweak Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_OPTIONS: --no-warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 配置Node稳定环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          allow-v0: true

      - name: 初始化系统依赖
        run: |
          sudo apt update
          sudo apt install -y curl git build-essential libplist-dev libxml2-dev bzip2

      - name: 安装配置Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 导入固定iOS编译SDK（带重试+双CDN兜底）
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          FILE="iPhoneOS15.0.sdk.tar.xz"
          # 主CDN: jsdelivr
          if ! wget --timeout=30 --tries=3 -q "https://cdn.jsdelivr.net/gh/theos/sdks@master/$FILE"; then
            echo "主CDN下载失败，切换备用CDN"
            wget --timeout=30 --tries=3 -q "https://ghproxy.com/https://github.com/theos/sdks/raw/master/$FILE"
          fi
          tar -xf "$FILE"

      - name: 执行Theos编译
        run: |
          cd $GITHUB_WORKSPACE
          make clean
          make package THEOS_DEVICE_SDK=iPhoneOS15.0

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-成品包
          path: ./packages/*.deb
