name: Theos Tweak Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_OPTIONS: --no-warnings
  THEOS: ${{ github.workspace }}/theos
  PATH: ${{ github.workspace }}/theos/bin:${{ env.PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 配置Node稳定环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          allow-v0: true

      - name: 初始化系统依赖
        run: |
          sudo apt update
          sudo apt install -y curl git build-essential libplist-dev libxml2-dev bzip2

      - name: 缓存Theos（含SDK，大幅减少重复下载）
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-15.0

      - name: 安装配置Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $THEOS

      - name: 自动获取 iPhoneOS15.0 SDK（使用theos sdks.sh，ghproxy加速）
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          cd $THEOS
          # 使用ghproxy代理，替换脚本内raw.githubusercontent.com链接
          sed -i 's|https://raw.githubusercontent.com|https://ghproxy.com/https://raw.githubusercontent.com|g' bin/sdks.sh
          chmod +x bin/sdks.sh
          ./bin/sdks.sh install iPhoneOS15.0

      - name: 执行Theos编译
        run: |
          cd $GITHUB_WORKSPACE
          make clean
          make package THEOS_DEVICE_SDK=iPhoneOS15.0

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-成品包
          path: ./packages/*.deb
