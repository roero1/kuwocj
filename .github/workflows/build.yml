name: Build KuwoAutoPlay
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git make curl unzip liblzma-dev build-essential fakeroot perl

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          # 手动拉取 iOS SDK (重点！之前就是缺这个)
          git clone https://github.com/theos/sdks $THEOS/sdks

      - name: Build Tweak (rootless)
        run: |
          export THEOS="${{ github.workspace }}/theos"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
