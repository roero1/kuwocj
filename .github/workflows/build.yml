name: Theos Tweak Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_OPTIONS: --no-warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 配置Node稳定环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          allow-v0: true

      - name: 初始化系统依赖
        run: |
          sudo apt update
          sudo apt install -y curl git build-essential libplist-dev libxml2-dev bzip2

      # ✅ 修改点：直接从github拉theos，不再走gitee
      - name: 安装配置Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      # ✅ SDK 用 jsdelivr 加速（jsdelivr可以代理 raw.githubusercontent，稳定性好很多）
      - name: 导入固定iOS编译SDK
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          wget -q https://cdn.jsdelivr.net/gh/theos/sdks@master/iPhoneOS15.0.sdk.tar.xz
          tar -xf iPhoneOS15.0.sdk.tar.xz

      - name: 执行Theos编译
        run: |
          cd $GITHUB_WORKSPACE
          make clean
          make package THEOS_DEVICE_SDK=iPhoneOS15.0

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-成品包
          path: ./packages/*.deb
